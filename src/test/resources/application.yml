llm:
  api-key: test-key
  base-url: https://openrouter.ai/api/v1
  model: openai/gpt-4o-mini
  http:
    customize-client: false
    max-attempts: 1

day16:
  server-port: 0
  path: /mcp

day17:
  server-port: 0
  path: /mcp
  store-dir: build/day17-tests-tasks

day18:
  server-port: 0
  path: /mcp
  store-dir: build/day18-tests-tasks
  tick-millis: 50

day19:
  server-port: 0
  path: /mcp
  store-dir: build/day19-tests-market

day20:
  server-port: 0
  path: /mcp

day21:
  server-port: 0
  path: /mcp
  store-dir: build/day21-tests-index
  corpus-dir: build/day21-tests-corpus
  chunk-size: 120
  chunk-overlap: 20

day22:
  strategy: fixed
  top-k: 5
  answer-max-tokens: 400

day23:
  strategy: fixed
  top-k-before: 10
  top-k-after: 5
  threshold: 0.5
  rewrite: true
  answer-max-tokens: 400

day24:
  strategy: fixed
  top-k-before: 10
  top-k-after: 5
  threshold: 0.5
  unknown-threshold: 0.32
  rewrite: true
  quotes-per-source: 3
  quote-min-chars: 24
  support-threshold: 0.35
  answer-max-tokens: 400

day25:
  strategy: fixed
  top-k-before: 10
  top-k-after: 5
  threshold: 0.5
  unknown-threshold: 0.32
  rewrite: true
  quotes-per-source: 3
  quote-min-chars: 24
  support-threshold: 0.35
  answer-max-tokens: 400
  history-limit: 40
  max-sessions: 50
  memory-terms-limit: 8
  store-dir: data/day25-chat-test

day26:
  endpoint: http://localhost:11434
  model: qwen2.5:3b
  connect-timeout-ms: 3000
  read-timeout-ms: 180000
  temperature: 0.2
  max-tokens: 300

day27:
  system-prompt: "Ты — тестовый локальный ассистент."
  history-limit: 6
  max-sessions: 5
  store-dir: build/day27-tests-chat

day28:
  strategy: fixed
  top-k-before: 10
  top-k-after: 5
  threshold: 0.5
  rewrite: true
  answer-max-tokens: 400
  evaluate-runs: 2

day29:
  benchmark-runs: 1
  questions-limit: 10
  tuned-temperature: 0.1
  tuned-num-ctx: 2048
  tuned-num-predict: 240