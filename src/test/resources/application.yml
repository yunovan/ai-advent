llm:
  api-key: test-key
  base-url: https://openrouter.ai/api/v1
  model: openai/gpt-4o-mini
  http:
    customize-client: false
    max-attempts: 1

day16:
  server-port: 0
  path: /mcp

day17:
  server-port: 0
  path: /mcp
  store-dir: build/day17-tests-tasks

day18:
  server-port: 0
  path: /mcp
  store-dir: build/day18-tests-tasks
  tick-millis: 50

day19:
  server-port: 0
  path: /mcp
  store-dir: build/day19-tests-market

day20:
  server-port: 0
  path: /mcp

day21:
  server-port: 0
  path: /mcp
  store-dir: build/day21-tests-index
  corpus-dir: build/day21-tests-corpus
  chunk-size: 120
  chunk-overlap: 20

day22:
  strategy: fixed
  top-k: 5
  answer-max-tokens: 400

day23:
  strategy: fixed
  top-k-before: 10
  top-k-after: 5
  threshold: 0.5
  rewrite: true
  answer-max-tokens: 400
