llm:
  api-key: test-key
  base-url: https://openrouter.ai/api/v1
  model: openai/gpt-4o-mini
  http:
    customize-client: false
    max-attempts: 1

day16:
  server-port: 0
  path: /mcp

day17:
  server-port: 0
  path: /mcp
  store-dir: build/day17-tests-tasks

day18:
  server-port: 0
  path: /mcp
  store-dir: build/day18-tests-tasks
  tick-millis: 50

day19:
  server-port: 0
  path: /mcp
  store-dir: build/day19-tests-market

day20:
  server-port: 0
  path: /mcp

day21:
  server-port: 0
  path: /mcp
  store-dir: build/day21-tests-index
  corpus-dir: build/day21-tests-corpus
  chunk-size: 120
  chunk-overlap: 20

day22:
  strategy: fixed
  top-k: 5
  answer-max-tokens: 400

day23:
  strategy: fixed
  top-k-before: 10
  top-k-after: 5
  threshold: 0.5
  rewrite: true
  answer-max-tokens: 400

day24:
  strategy: fixed
  top-k-before: 10
  top-k-after: 5
  threshold: 0.5
  unknown-threshold: 0.32
  rewrite: true
  quotes-per-source: 3
  quote-min-chars: 24
  support-threshold: 0.35
  answer-max-tokens: 400

day25:
  strategy: fixed
  top-k-before: 10
  top-k-after: 5
  threshold: 0.5
  unknown-threshold: 0.32
  rewrite: true
  quotes-per-source: 3
  quote-min-chars: 24
  support-threshold: 0.35
  answer-max-tokens: 400
  history-limit: 40
  max-sessions: 50
  memory-terms-limit: 8
  store-dir: data/day25-chat-test

day26:
  endpoint: http://localhost:11434
  model: qwen2.5:3b
  connect-timeout-ms: 3000
  read-timeout-ms: 180000
  temperature: 0.2
  max-tokens: 300

day27:
  system-prompt: "Ты — тестовый локальный ассистент."
  history-limit: 6
  max-sessions: 5
  store-dir: build/day27-tests-chat

day28:
  strategy: fixed
  top-k-before: 10
  top-k-after: 5
  threshold: 0.5
  rewrite: true
  answer-max-tokens: 400
  evaluate-runs: 2

day29:
  benchmark-runs: 1
  questions-limit: 10
  tuned-temperature: 0.1
  tuned-num-ctx: 2048
  tuned-num-predict: 240

day30:
  host: localhost
  port: 8080
  max-messages: 12
  max-prompt-chars: 6000
  rate-limit-per-minute: 10
  max-concurrent: 4
  max-sessions: 50
  stress-requests: 6
  stress-concurrency: 3
  temperature: 0.2
  max-tokens: 300

day31:
  server-port: 0
  path: /mcp
  name: ai-advent-git-mcp
  version: 0.1.0
  repository-dir: .
  docs-dir: docs
  readme-path: README.md
  top-k: 5
  candidate-k: 12
  chunk-size: 700
  chunk-overlap: 80
  git-timeout-ms: 5000
  answer-max-tokens: 400
  max-files: 300
  max-diff-chars: 6000
  temperature: 0.2

day32:
  repository-dir: .
  base-ref: main
  head-ref: HEAD
  docs-dir: docs
  readme-path: README.md
  code-dir: src/main/java
  top-k: 6
  candidate-k: 12
  chunk-size: 700
  chunk-overlap: 80
  git-timeout-ms: 5000
  max-diff-chars: 14000
  max-files: 100
  answer-max-tokens: 700
  temperature: 0.1

day33:
  server-port: 0
  path: /mcp
  name: ai-advent-crm-mcp
  version: 0.1.0
  kb-dir: data/day33-kb
  crm-dir: build/day33-tests-crm
  top-k: 5
  candidate-k: 12
  chunk-size: 700
  chunk-overlap: 80
  answer-max-tokens: 400
  temperature: 0.2

day34:
  server-port: 0
  path: /mcp
  name: ai-advent-file-mcp
  version: 0.1.0
  workspace-dir: .
  code-dir: src/main/java
  docs-dir: docs
  readme-path: README.md
  output-dir: build/day34-tests-output
  top-k: 6
  candidate-k: 12
  chunk-size: 700
  chunk-overlap: 80
  max-files: 200
  max-file-bytes: 200000
  max-read-lines: 400
  search-max-results: 100
  answer-max-tokens: 700
  temperature: 0.2
day35:
  serverPort: 0
  path: /api/day35
  maxProblems: 3
  temperature: 0.2
  answerMaxTokens: 256