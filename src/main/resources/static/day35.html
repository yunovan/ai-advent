<!DOCTYPE html><html lang='ru'><head><meta charset='UTF-8'><title>AI Advent · День 35</title>
<style>:root{--bg:#0d141f;--card:#16202e;--line:#26374a;--text:#eaf4ff;--muted:#8fa6c4;--accent:#7aa2f7;--ok:#7bd88f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1c2a4a,#0d141f 55%);color:var(--text);font-family:Georgia,serif}main{max-width:900px;margin:0 auto;padding:48px 20px}.nav{display:flex;gap:12px;flex-wrap:wrap;font-family:sans-serif;font-size:14px;margin-bottom:16px}.nav a{color:var(--accent);text-decoration:none}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}button{padding:10px 14px;border-radius:10px;border:0;background:var(--accent);color:#0b1220;font-weight:700;cursor:pointer}input,select{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#101a29;color:var(--text)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hint{color:var(--muted);font-family:sans-serif;font-size:12px;margin-top:10px}</style></head>
<body><main><nav class='nav'><a href='/index.html'>Главная</a><a href='/day34.html'>День 34</a><a href='/day35.html'>День 35</a></nav>
<h1>AI-тьютор по математике</h1>
<div class='card'><div class='row'><select id='topic'><option value='algebra'>Алгебра</option><option value='geometry'>Геометрия</option><option value='fractions'>Дроби</option><option value='trigonometry'>Тригонометрия</option></select><input id='count' type='number' min='1' max='5' value='3'><button id='start'>Начать обучение</button></div><div class='hint'>Реальная задача: пошаговое обучение с разбором решения и объяснением ошибок. AI участвует в генерации объяснений/анализа через локальную LLM.</div></div>
<div class='card' id='task' style='display:none'><div id='q'></div><input id='ans' style='margin-top:8px;width:100%'><div class='row' style='margin-top:8px'><button id='check'>Проверить</button><button id='hint'>Подсказка</button></div><div id='res' style='margin-top:10px'></div></div>
<script>
async function get(url){const r=await fetch(url);return r.json();}
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});return r.json();}
let sid=null,step=0,probs=[]; document.getElementById('start').onclick=async()=>{const t=document.getElementById('topic').value,c=+document.getElementById('count').value;const s=await post('/api/day35/sessions',{topic:t,count:c});sid=s.sessionId;probs=[s.problem];document.getElementById('task').style.display='block';show(probs[0]);};
function show(p){document.getElementById('q').textContent=p.question;document.getElementById('ans').value='';document.getElementById('res').textContent='';}
document.getElementById('check').onclick=async()=>{const a=document.getElementById('ans').value;const r=await post('/api/day35/sessions/'+sid+'/answer',{userAnswer:a},{step,problems:probs,currentProblemId:probs[0].id});document.getElementById('res').textContent=r.solution.explanation+(r.analysis?' | '+r.analysis.mistake:'');};
</script></main></body></html>
