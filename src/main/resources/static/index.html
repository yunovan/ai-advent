<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Advent — День 1</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #10131a;
            --card: #1a2030;
            --line: #2c3548;
            --text: #eef2ff;
            --muted: #9aa6bf;
            --accent: #7aa2ff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            background: radial-gradient(circle at top, #1d2740, var(--bg) 55%);
            color: var(--text);
        }
        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 20px;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--accent);
            font-family: ui-sans-serif, system-ui, sans-serif;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .nav {
            display: flex;
            gap: 16px;
            margin-bottom: 18px;
            font-family: ui-sans-serif, system-ui, sans-serif;
            font-size: 14px;
        }
        .nav a { color: var(--accent); text-decoration: none; }
        h1 { margin: 16px 0 8px; font-size: 36px; }
        p.lead { color: var(--muted); margin-bottom: 28px; }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-family: ui-sans-serif, system-ui, sans-serif;
            font-size: 13px;
            color: var(--muted);
        }
        textarea, button, pre {
            width: 100%;
            font-size: 16px;
        }
        textarea {
            min-height: 110px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: #121826;
            color: var(--text);
            resize: vertical;
        }
        button {
            margin-top: 12px;
            padding: 12px 16px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: #0d1320;
            font-weight: 700;
            font-family: ui-sans-serif, system-ui, sans-serif;
            cursor: pointer;
        }
        button:disabled { opacity: 0.6; cursor: wait; }
        pre {
            margin-top: 16px;
            min-height: 80px;
            padding: 12px;
            border-radius: 10px;
            background: #0d121c;
            border: 1px solid var(--line);
            white-space: pre-wrap;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>
<main>
        <nav class="nav">
            <a href="/">День 1</a>
            <a href="/day2.html">День 2</a>
            <a href="/day3.html">День 3</a>
        </nav>
        <span class="badge">AI Advent · Day 1</span>
    <h1>Первый запрос к LLM</h1>
    <p class="lead">Минимальный агент: отправить промпт в API, получить ответ и показать его здесь.</p>
    <div class="card">
        <label for="prompt">Промпт</label>
        <textarea id="prompt">Привет! Кто ты и что умеешь в одном предложении?</textarea>
        <button id="send" type="button">Отправить в LLM</button>
        <pre id="output">Ответ появится здесь.</pre>
    </div>
</main>
<script>
    const promptEl = document.getElementById("prompt");
    const outputEl = document.getElementById("output");
    const sendEl = document.getElementById("send");

    sendEl.addEventListener("click", async () => {
        const prompt = promptEl.value.trim();
        if (!prompt) {
            outputEl.textContent = "Введите промпт.";
            return;
        }
        sendEl.disabled = true;
        outputEl.textContent = "Жду ответ модели...";
        try {
            const response = await fetch("/api/day1/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
                outputEl.textContent = data.error || data.detail || data.message || ("HTTP " + response.status);
                return;
            }
            outputEl.textContent = (data.model ? "[" + data.model + "]\n\n" : "") + data.content;
        } catch (error) {
            outputEl.textContent = "Не удалось выполнить запрос: " + error;
        } finally {
            sendEl.disabled = false;
        }
    });
</script>
</body>
</html>
