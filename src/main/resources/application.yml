spring:
  application:
    name: ai-advent
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:./application-local.yml

server:
  port: 8080

llm:
  api-key: ${LLM_API_KEY:${OPENAI_API_KEY:}}
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  model: ${LLM_MODEL:gpt-4o-mini}
