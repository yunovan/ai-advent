spring:
  application:
    name: ai-advent
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:./application-local.yml

server:
  port: 8080

llm:
  api-key: ${LLM_API_KEY:${OPENROUTER_API_KEY:${OPENAI_API_KEY:}}}
  base-url: ${LLM_BASE_URL:https://openrouter.ai/api/v1}
  model: ${LLM_MODEL:openai/gpt-4o-mini}
  http:
    customize-client: true
    connect-timeout: 15s
    read-timeout: 120s
    max-attempts: 3

day5:
  weak-model: ${DAY5_WEAK_MODEL:meta-llama/llama-3.2-3b-instruct}
  medium-model: ${DAY5_MEDIUM_MODEL:qwen/qwen-2.5-7b-instruct}
  strong-model: ${DAY5_STRONG_MODEL:meta-llama/llama-3.3-70b-instruct}

day7:
  dialog-dir: ${DAY7_DIALOG_DIR:data/day7-dialogs}

day8:
  dialog-dir: ${DAY8_DIALOG_DIR:data/day8-dialogs}
  context-limit: ${DAY8_CONTEXT_LIMIT:128000}
  input-price: ${DAY8_INPUT_PRICE:0.15}
  output-price: ${DAY8_OUTPUT_PRICE:0.60}

day9:
  dialog-dir: ${DAY9_DIALOG_DIR:data/day9-dialogs}
  context-limit: ${DAY9_CONTEXT_LIMIT:128000}
  input-price: ${DAY9_INPUT_PRICE:0.15}
  output-price: ${DAY9_OUTPUT_PRICE:0.60}
  recent-messages: ${DAY9_RECENT_MESSAGES:10}
  chunk-size: ${DAY9_CHUNK_SIZE:10}

day10:
  dialog-dir: ${DAY10_DIALOG_DIR:data/day10-dialogs}
  context-limit: ${DAY10_CONTEXT_LIMIT:128000}
  input-price: ${DAY10_INPUT_PRICE:0.15}
  output-price: ${DAY10_OUTPUT_PRICE:0.60}
  default-window: ${DAY10_DEFAULT_WINDOW:8}

