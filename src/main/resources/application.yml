spring:
  application:
    name: ai-advent
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:./application-local.yml

server:
  port: 8080

llm:
  api-key: ${LLM_API_KEY:${OPENROUTER_API_KEY:${OPENAI_API_KEY:}}}
  base-url: ${LLM_BASE_URL:https://openrouter.ai/api/v1}
  model: ${LLM_MODEL:openai/gpt-4o-mini}
  http:
    customize-client: true
    connect-timeout: 15s
    read-timeout: 120s
    max-attempts: 3

day5:
  weak-model: ${DAY5_WEAK_MODEL:meta-llama/llama-3.2-3b-instruct}
  medium-model: ${DAY5_MEDIUM_MODEL:qwen/qwen-2.5-7b-instruct}
  strong-model: ${DAY5_STRONG_MODEL:meta-llama/llama-3.3-70b-instruct}

